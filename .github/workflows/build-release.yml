name: Build luci-app-xray

on:
  workflow_dispatch:

env:
  OPENWRT_VERSION: 25.12.2
  CACHE_DIR: ${{ github.workspace }}/cache
  PACKAGE_NAME: luci-app-xray

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64_cortex-a53, aarch64_cortex-a72, arm_cortex-a7_neon-vfpv4, aarch64_generic]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set SDK URL
        run: |
          case "${{ matrix.arch }}" in
            x86_64) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-sdk-${OPENWRT_VERSION}-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            aarch64_cortex-a53) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/mediatek/filogic/openwrt-sdk-${OPENWRT_VERSION}-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            aarch64_cortex-a72) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/mvebu/cortexa72/openwrt-sdk-${OPENWRT_VERSION}-mvebu-cortexa72_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            arm_cortex-a7_neon-vfpv4) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/bcm27xx/bcm2709/openwrt-sdk-${OPENWRT_VERSION}-bcm27xx-bcm2709_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst" ;;
            aarch64_generic) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/rockchip/armv8/openwrt-sdk-${OPENWRT_VERSION}-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            *) echo "Unknown architecture"; exit 1 ;;
          esac
          echo "SDK_URL=$SDK_URL" >> $GITHUB_ENV

      - name: Prepare SDK
        run: |
          SDK_DIR="${CACHE_DIR}/${{ matrix.arch }}"
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          SDK_FILE=$(basename $SDK_URL)
          wget -q $SDK_URL -O "$SDK_FILE" || { echo "❌ Failed to download SDK"; exit 1; }
          mkdir sdk_home
          tar --zstd -xf "$SDK_FILE" --strip-components=1 -C sdk_home
          echo "SDK_HOME=$SDK_DIR/sdk_home" >> $GITHUB_ENV

      - name: Install Python prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-dev swig
          python3 -m pip install --user pyelftools

      - name: Setup feeds and copy package
        run: |
          cd $SDK_HOME
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Копируем пакет luci-app-xray в SDK
          mkdir -p package/luci-app-xray

          # копируем core, geodata, status и Makefile
          cp -r $GITHUB_WORKSPACE/core/* package/luci-app-xray/
          cp -r $GITHUB_WORKSPACE/geodata/root/* package/luci-app-xray/
          cp -r $GITHUB_WORKSPACE/status/root/* package/luci-app-xray/
          cp $GITHUB_WORKSPACE/Makefile package/luci-app-xray/

      - name: Build luci-app-xray
        run: |
          cd $SDK_HOME
          make defconfig
          make package/luci-app-xray/compile V=s

      - name: Collect APK
        run: |
          cd $SDK_HOME
          echo "📦 Searching APK..."
          ARCH_SUFFIX=${{ matrix.arch }}
          for f in $(find bin/ -type f -name "openwrt-xray-*.apk"); do
              cp "$f" "$GITHUB_WORKSPACE/$(basename $f .apk)-${ARCH_SUFFIX}.apk"
          done
          ls -lh $GITHUB_WORKSPACE/*${ARCH_SUFFIX}.apk || (echo "❌ No APK found" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-${{ matrix.arch }}-${OPENWRT_VERSION}
          path: $GITHUB_WORKSPACE/*${{ matrix.arch }}.apk
