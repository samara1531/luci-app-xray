name: Build and Release LuCI-App-Xray

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-xray
  CACHE_DIR: ~/cache

jobs:
  release:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/openwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: aarch64_cortex-a53
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/mediatek/filogic/openwrt-sdk-25.12.2-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: aarch64_cortex-a72
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/mvebu/cortexa72/openwrt-sdk-25.12.2-mvebu-cortexa72_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - arch: arm_cortex-a7_neon-vfpv4
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/bcm27xx/bcm2709/openwrt-sdk-25.12.2-bcm27xx-bcm2709_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
          - arch: aarch64_generic
            sdk_url: https://downloads.openwrt.org/releases/25.12.2/targets/rockchip/armv8/openwrt-sdk-25.12.2-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    env:
      SDK_URL: ${{ matrix.sdk_url }}
      CCACHE_DIR: ~/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext libncurses5-dev xsltproc p7zip-full zstd

      - name: Prepare SDK
        run: |
          mkdir -p "$CACHE_DIR/sdk_home"
          SDK_FILE="$CACHE_DIR/sdk_home/$(basename $SDK_URL)"
          wget -q "$SDK_URL" -O "$SDK_FILE"
          tar --zstd -xf "$SDK_FILE" -C "$CACHE_DIR/sdk_home" --strip-components=1
          echo "SDK_HOME=$CACHE_DIR/sdk_home" >> $GITHUB_ENV

      - name: Prepare feeds
        run: |
          cd "$SDK_HOME"
          test -d "feeds" || mkdir feeds
          cp feeds.conf.default feeds.conf
          sed -i 's/git.openwrt.org/github.com/g' feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd -

      - name: Link Package
        run: |
          ln -s ${{ github.workspace }} "$CACHE_DIR/sdk_home/package/${PACKAGE_NAME}"

      - name: Build LuCI App
        run: |
          cd "$CACHE_DIR/sdk_home"
          make package/${PACKAGE_NAME}/clean V=s || true
          make package/${PACKAGE_NAME}/compile V=s
          cd -

      - name: Copy APKs
        run: |
          mkdir -p "${{ github.workspace }}/release"
          find "$CACHE_DIR/sdk_home/bin/packages/" -type f -name "${PACKAGE_NAME}_*.ipk" | while read f; do
            arch_label=$(basename "$f" | cut -d'_' -f3)
            cp "$f" "${{ github.workspace }}/release/${PACKAGE_NAME}_${arch_label}.apk"
          done
          ls -lh "${{ github.workspace }}/release"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: "release/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
