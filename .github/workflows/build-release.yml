name: Build and Release luci-app-xray

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  OPENWRT_VERSION: 25.12.2
  CACHE_DIR: ${{ github.workspace }}/cache

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64_cortex-a53, aarch64_cortex-a72, arm_cortex-a7_neon-vfpv4, aarch64_generic]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set SDK URL
        run: |
          case "${{ matrix.arch }}" in
            x86_64) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-sdk-${OPENWRT_VERSION}-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            aarch64_cortex-a53) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/mediatek/filogic/openwrt-sdk-${OPENWRT_VERSION}-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            aarch64_cortex-a72) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/mvebu/cortexa72/openwrt-sdk-${OPENWRT_VERSION}-mvebu-cortexa72_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            arm_cortex-a7_neon-vfpv4) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/bcm27xx/bcm2709/openwrt-sdk-${OPENWRT_VERSION}-bcm27xx-bcm2709_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst" ;;
            aarch64_generic) SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/rockchip/armv8/openwrt-sdk-${OPENWRT_VERSION}-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst" ;;
            *) echo "Unknown architecture"; exit 1 ;;
          esac
          echo "SDK_URL=$SDK_URL" >> $GITHUB_ENV

      - name: Prepare SDK
        run: |
          SDK_DIR="${CACHE_DIR}/${{ matrix.arch }}"
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"

          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir sdk_home
          tar --zstd -xf sdk.tar.zst --strip-components=1 -C sdk_home

          echo "SDK_HOME=$SDK_DIR/sdk_home" >> $GITHUB_ENV

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-pip python3-pyelftools python3-setuptools python3-dev swig \
            rsync unzip zstd file wget curl

      - name: Setup feeds
        run: |
          cd $SDK_HOME
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy packages (ВАЖНО: структура репы)
        run: |
          cd $SDK_HOME

          # core
          mkdir -p package/luci-app-xray
          cp -r $GITHUB_WORKSPACE/core/* package/luci-app-xray/

          # geodata
          mkdir -p package/luci-app-xray-geodata
          cp -r $GITHUB_WORKSPACE/geodata/* package/luci-app-xray-geodata/

          # status
          mkdir -p package/luci-app-xray-status
          cp -r $GITHUB_WORKSPACE/status/* package/luci-app-xray-status/

      - name: Build packages
        run: |
          cd $SDK_HOME
          make defconfig

          make package/luci-app-xray/compile V=s
          make package/luci-app-xray-geodata/compile V=s
          make package/luci-app-xray-status/compile V=s

      - name: Collect APKs (фикс имени + архитектура)
        run: |
          cd $SDK_HOME
          echo "📦 Collecting APKs..."

          mkdir -p $GITHUB_WORKSPACE/out

          for pkg in luci-app-xray luci-app-xray-geodata luci-app-xray-status; do
            find bin/packages -type f -name "${pkg}*.apk" | while read f; do
              base=$(basename "$f" .apk)
              cp "$f" "$GITHUB_WORKSPACE/out/${base}-${{ matrix.arch }}.apk"
            done
          done

          ls -lh $GITHUB_WORKSPACE/out/*.apk || (echo "❌ No APK found" && exit 1)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
